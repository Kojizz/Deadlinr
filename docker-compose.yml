services:
  backend:
    profiles: [app]
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/deadlinr
      SPRING_DATASOURCE_USERNAME: deadlinr
      SPRING_DATASOURCE_PASSWORD: deadlinr
      APP_STORAGE_PATH: /app/storage
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      APP_OAUTH_ENABLED: ${APP_OAUTH_ENABLED:-false}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
    ports: ["8080:8080"]
    volumes: ["deadlinr-attachments:/app/storage"]
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    container_name: deadlinr-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-deadlinr}
      POSTGRES_USER: ${DB_USERNAME:-deadlinr}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-deadlinr}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - deadlinr-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-deadlinr} -d ${DB_NAME:-deadlinr}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: deadlinr-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  prometheus:
    image: prom/prometheus:latest
    container_name: deadlinr-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - deadlinr-prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: deadlinr-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - deadlinr-grafana-data:/var/lib/grafana
    ports:
      # 3001 (not 3000) - the Next.js dev server owns 3000
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus

volumes:
  deadlinr-attachments:
  deadlinr-db-data:
  deadlinr-prometheus-data:
  deadlinr-grafana-data:
